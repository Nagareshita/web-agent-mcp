[project]
name = "web-agent-mcp"
version = "0.1.0"
description = "Web research MCP server with SearXNG, HTML/PDF extraction, and FTS5 indexing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.9.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "trafilatura>=1.12.0",
    "readability-lxml>=0.8.1",
    "html2text>=2024.2.26",
    "pymupdf>=1.24.0",
    "diskcache>=5.6.3",
    "platformdirs>=4.2.2",
    "tenacity>=8.3.0",
    "playwright>=1.44.0",
]

[project.optional-dependencies]
playwright = ["playwright>=1.44.0"]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "respx>=0.21.1",
    "ruff>=0.4.8",
]

[project.scripts]
web-agent-mcp = "web_agent_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.15.16",
]
